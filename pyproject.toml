[project]
name = "talos-tabletop"
version = "0.1.0"
description = "Standing whole-body tabletop manipulation with PAL TALOS in MJLab"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "mjlab==1.5.0",
    "scipy>=1.10",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.14.14",
]

[project.optional-dependencies]
cu128 = ["torch>=2.7.0"]
cpu = ["torch>=2.7.0"]

[project.entry-points."mjlab.tasks"]
talos_tabletop = "talos_tabletop.tasks"

[tool.uv]
conflicts = [
  [{extra = "cu128"}, {extra = "cpu"}],
]

[tool.ruff]
indent-width = 2
src = ["talos_tabletop"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:torch.jit._script",
]
